[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verum"
version = "0.0.0"
description = "Backend for VERUM, a synthetic gasoline-terminal simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    # Without this package jsonschema silently skips the date-time format check.
    "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-jsonschema",
    "hypothesis>=6.170.13",
]
# Needed only to re-run the vendored reference scripts, not by the package.
# numpy >= 2 because the audited schema reference tests call numpy.trapezoid.
reference = [
    "numpy>=2",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "D100", "D104", "UP", "B"]
