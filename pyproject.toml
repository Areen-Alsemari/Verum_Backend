[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verum"
version = "0.0.0"
description = "Backend for VERUM, a synthetic gasoline-terminal simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    # Without this package jsonschema silently skips the date-time format check.
    "rfc3339-validator>=0.1.4",
    "numpy>=2",
    "scipy>=1.11",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
# Optional tracing of the runner; the runner works without it and sends nothing unless enabled.
tracing = ["langsmith>=0.14.17"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-jsonschema",
    "hypothesis>=6.170.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fast: no long engine run (added automatically to every test that is not slow)",
    "slow: depends on the shared episode runs or runs the engine for more than a few seconds",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "tests"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["verum.transient.*"]
warn_return_any = false  # numpy array expressions are typed Any by the stubs in use

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "D100", "D104", "UP", "B"]
